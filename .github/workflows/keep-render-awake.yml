name: Keep Render service awake

on:
  schedule:
    # Backup check only: GitHub scheduled workflows are best-effort and may be delayed.
    # The primary keep-awake monitor runs externally every 5 minutes.
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-render-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Ping MoodMix health endpoint
        shell: bash
        run: |
          curl \
            --fail \
            --show-error \
            --silent \
            --location \
            --max-time 120 \
            --retry 3 \
            --retry-delay 10 \
            --retry-all-errors \
            --output /dev/null \
            "https://moodmix-volcano0813.onrender.com/api/test?source=github-actions"
